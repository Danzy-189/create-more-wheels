modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Danzy-189/create-more-wheels/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Offroad registers the offroad:tire data component that our wheels rely on.
# We do not compile against it, but it must be present and loaded first.
[[dependencies.${mod_id}]]
modId = "offroad"
type = "required"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
